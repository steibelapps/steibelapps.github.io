<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Brief Trivia</title>
<meta name="description" content="A trivia round shared from Daily Brief. Answer the same questions as everyone in the chat.">
<meta property="og:title" content="Trivia round">
<meta property="og:description" content="Tap to play the same questions as everyone in the chat.">
<meta name="theme-color" content="#E8742F">
<style>
:root {
  --ground: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #E8EAF1;
  --ink: #1B1D29;
  --ink-soft: #5B5F73;
  --line: #D6D9E3;
  --accent: #E8742F;
  --accent-ink: #FFFFFF;
  --good: #1F9D57;
  --good-soft: #DDF3E6;
  --bad: #D2423A;
  --bad-soft: #FBE3E1;
  --shadow: 0 1px 2px rgba(27,29,41,.06), 0 8px 24px rgba(27,29,41,.08);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #13141B;
    --surface: #1D1F29;
    --surface-2: #272A36;
    --ink: #EDEEF4;
    --ink-soft: #A2A6B8;
    --line: #333747;
    --accent: #F0843F;
    --good: #3CC47A;
    --good-soft: #173826;
    --bad: #F0675E;
    --bad-soft: #3D1D1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --ground: #13141B;
  --surface: #1D1F29;
  --surface-2: #272A36;
  --ink: #EDEEF4;
  --ink-soft: #A2A6B8;
  --line: #333747;
  --accent: #F0843F;
  --good: #3CC47A;
  --good-soft: #173826;
  --bad: #F0675E;
  --bad-soft: #3D1D1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 17px/1.45 var(--body);
  padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 22px; font-weight: 800; }
p { margin: 0; }
.soft { color: var(--ink-soft); }
.small { font-size: 14px; }
.mast { display: flex; align-items: center; gap: 12px; }
.mast svg { flex: none; }
.mast .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.panel { background: var(--surface); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 16px; }
label.field { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
input[type=text] {
  font: inherit; color: var(--ink); background: var(--ground);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; width: 100%;
}
input[type=text]:focus { outline: none; border-color: var(--accent); }
.label { font-weight: 700; font-size: 15px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.chip {
  font: inherit; font-size: 15px; border: 0; border-radius: 11px; padding: 9px 10px; cursor: pointer;
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--c); color: #fff; font-weight: 700; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 11px; padding: 3px; }
.seg button { font: inherit; font-size: 15px; border: 0; background: transparent; color: var(--ink); padding: 8px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 700; }
.btn {
  font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 14px; padding: 14px 18px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .answer:focus-visible, .seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.row { display: grid; gap: 10px; }
.error { color: var(--bad); font-size: 15px; }

/* The question card: the same card the chat shows. */
.card {
  position: relative; overflow: hidden; border-radius: 20px; padding: 18px 18px 16px; color: #fff;
  background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 70%, var(--ground)));
  min-height: 190px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; box-shadow: var(--shadow);
}
.card .meta { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .9; display: flex; gap: 6px; align-items: center; }
.card .meta .count { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.card .q { font-family: var(--display); font-weight: 800; font-size: clamp(21px, 5.6vw, 26px); line-height: 1.18; text-wrap: balance; }
.card .ghost { position: absolute; right: -18px; bottom: -26px; width: 150px; height: 150px; opacity: .14; pointer-events: none; }
.bar { display: flex; gap: 4px; }
.bar i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.24); }
.bar i.done { background: rgba(255,255,255,.95); }
.bar i.now { background: rgba(255,255,255,.58); }

.answers { display: grid; gap: 10px; }
.answer {
  font: inherit; text-align: left; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; cursor: pointer;
}
.answer .letter { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); }
.answer .who { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.answer .mark { font-weight: 700; font-size: 20px; }
.answer:disabled { cursor: default; }
.answer.right { border-color: var(--good); background: var(--good-soft); }
.answer.right .letter { background: var(--good); color: #fff; }
.answer.right .mark { color: var(--good); }
.answer.wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer.wrong .letter { background: var(--bad); color: #fff; }
.answer.wrong .mark { color: var(--bad); }
.answer.faded { opacity: .6; }
.verdict { font-family: var(--display); font-size: 20px; font-weight: 800; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.standings { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.standings li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--ground); }
.standings li.me { outline: 2px solid var(--accent); }
.standings .place { color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.standings .pts { font-weight: 700; font-variant-numeric: tabular-nums; }
.standings .note { grid-column: 2 / 4; font-size: 13px; color: var(--ink-soft); }
.trophy { font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
footer { font-size: 13px; color: var(--ink-soft); text-align: center; }
footer a { color: inherit; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .toast { transition: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  "use strict";

  // ---- The round, in the same shape the iMessage app packs into its link ----
  // { v, id, qs: [{c, d, q, a: [4 answers], k: right index}], i, n: {player: name}, p: {player: [pick per question, -1 = none]} }

  // "Anything" and the twelve sections of the app's own question bank.
  const CATEGORIES = [
    [null, "Anything"], [1, "American History"], [2, "World"], [3, "Business & Tech"],
    [4, "Science"], [5, "Health"], [6, "Sports"], [7, "Entertainment"], [8, "Food"],
    [9, "Song Years"], [10, "Movie Years"], [11, "TV Years"], [12, "Mythology"]
  ];
  const DIFFICULTIES = ["Easy", "Medium", "Hard"];
  const LETTERS = ["A", "B", "C", "D", "E", "F"];

  // Colors match the app's trivia widget and the iMessage card.
  function look(name) {
    const n = (name || "").toLowerCase();
    const rgb = (r, g, b) => `rgb(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)})`;
    let c, icon;
    if (n.includes("computer")) [c, icon] = [rgb(.20, .45, .85), "chip"];
    else if (n.includes("math")) [c, icon] = [rgb(.30, .40, .80), "sum"];
    else if (n.includes("science")) [c, icon] = [rgb(.20, .62, .40), "leaf"];
    else if (n.includes("animal")) [c, icon] = [rgb(.40, .60, .25), "paw"];
    else if (n.includes("geograph")) [c, icon] = [rgb(.10, .58, .62), "globe"];
    else if (n.includes("history")) [c, icon] = [rgb(.62, .42, .22), "columns"];
    else if (n.includes("mytholog")) [c, icon] = [rgb(.55, .35, .70), "bolt"];
    else if (n.includes("sport")) [c, icon] = [rgb(.92, .50, .15), "ball"];
    else if (n.includes("art")) [c, icon] = [rgb(.85, .35, .50), "palette"];
    else if (n.includes("music")) [c, icon] = [rgb(.80, .30, .60), "note"];
    else if (n.includes("film") || n.includes("television") || n.includes("cartoon")) [c, icon] = [rgb(.60, .30, .75), "film"];
    else if (n.includes("game")) [c, icon] = [rgb(.35, .35, .80), "pad"];
    else if (n.includes("book") || n.includes("comics")) [c, icon] = [rgb(.55, .40, .30), "book"];
    // The bank's sections that the names above do not already catch.
    else if (n.includes("world")) [c, icon] = [rgb(.10, .58, .62), "globe"];
    else if (n.includes("business")) [c, icon] = [rgb(.20, .45, .85), "chip"];
    else if (n.includes("health")) [c, icon] = [rgb(.86, .26, .32), "heart"];
    else if (n.includes("food")) [c, icon] = [rgb(.80, .45, .20), "fork"];
    else if (n.includes("song")) [c, icon] = [rgb(.80, .30, .60), "note"];
    else if (n.includes("movie")) [c, icon] = [rgb(.60, .30, .75), "film"];
    else if (n.startsWith("tv")) [c, icon] = [rgb(.35, .35, .80), "tv"];
    else if (n.includes("entertainment")) [c, icon] = [rgb(.60, .30, .75), "film"];
    else [c, icon] = [rgb(.90, .62, .12), "bulb"];
    const short = (name || "").replace("Entertainment: ", "").replace("Science: ", "");
    return { c, icon, short };
  }

  // Small line icons, drawn here so the page needs nothing else.
  const ICONS = {
    leaf: '<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14Zm0 0 7-7"/>',
    paw: '<circle cx="7" cy="9" r="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="17" cy="9" r="2"/><path d="M8 17c0-3 2-5 4-5s4 2 4 5c0 1.5-1.5 2-4 2s-4-.5-4-2Z"/>',
    globe: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 3.5 5 3.5 8s-1 5.5-3.5 8c-2.5-2.5-3.5-5-3.5-8s1-5.5 3.5-8Z"/>',
    columns: '<path d="M4 9 12 4l8 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3.5 20h17"/>',
    bolt: '<path d="M13 3 5 13h6l-1 8 8-10h-6l1-8Z"/>',
    ball: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
    palette: '<path d="M12 4a8 8 0 0 0 0 16c1.2 0 1.7-.8 1.4-1.8-.4-1.2.4-2.2 1.6-2.2H17a3 3 0 0 0 3-3c0-5-3.6-9-8-9Z"/><circle cx="8.5" cy="11" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="15.5" cy="11" r="1"/>',
    note: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    film: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 5v14M16 5v14M4 9.5h4M4 14.5h4M16 9.5h4M16 14.5h4"/>',
    pad: '<path d="M7 8h10a4 4 0 0 1 4 4v1a3 3 0 0 1-5.4 1.8L14.5 14h-5l-1.1.8A3 3 0 0 1 3 13v-1a4 4 0 0 1 4-4Z"/><path d="M8 10.5v3M6.5 12h3"/>',
    book: '<path d="M5 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H5V5ZM19 5h-4a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h4V5Z"/>',
    chip: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
    sum: '<path d="M17 5H7l5 7-5 7h10"/>',
    heart: '<path d="M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20Z"/>',
    fork: '<path d="M7 4v6a2 2 0 0 0 2 2v8M5 4v5M9 4v5M17 20v-7h-2V8c0-2.2.9-4 2-4v9"/>',
    tv: '<rect x="4" y="7" width="16" height="11" rx="2"/><path d="M9 3l3 4 3-4M9 21h6"/>',
    bulb: '<path d="M9 17h6M10 20h4M12 4a5 5 0 0 0-3 9c.6.5 1 1.2 1 2h4c0-.8.4-1.5 1-2a5 5 0 0 0-3-9Z"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>'
  };
  const icon = (k, size = 16, stroke = 2) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ICONS.bulb}</svg>`;

  // ---- Storage (per browser, best effort) ----
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  function playerId() {
    let id = store.get("trivia.pid");
    if (!id) {
      id = "web-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, "0")).join("");
      store.set("trivia.pid", id);
    }
    return id;
  }
  // Who this browser is inside one round: the stored id scrambled with the
  // round's id, so two links cannot be tied to the same player.
  const PID = playerId();
  function me(g) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    const str = PID + "|" + g.id;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return "w" + (h2 >>> 0).toString(16).padStart(8, "0") + (h1 >>> 0).toString(16).padStart(8, "0").slice(0, 4);
  }
  let myName = store.get("trivia.name") || "";

  // ---- Packing: base64url of the round's JSON, after #g= ----
  function pack(g) {
    const bytes = new TextEncoder().encode(JSON.stringify(g));
    let s = "";
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unpack(s) {
    try {
      let t = s.replace(/-/g, "+").replace(/_/g, "/");
      while (t.length % 4) t += "=";
      const bin = atob(t);
      const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
      const g = JSON.parse(new TextDecoder().decode(bytes));
      if (!g || !Array.isArray(g.qs) || !g.qs.length || typeof g.id !== "string") return null;
      g.v = g.v || 1; g.i = g.i || 0; g.n = g.n || {}; g.p = g.p || {};
      return g;
    } catch { return null; }
  }
  const linkFor = g => location.origin + location.pathname + "#g=" + pack(g);

  function merge(a, b) {
    if (!b || a.id !== b.id) return a;
    const g = JSON.parse(JSON.stringify(a));
    g.i = Math.max(a.i || 0, b.i || 0);
    for (const [k, v] of Object.entries(b.n || {})) if (!g.n[k]) g.n[k] = v;
    for (const [k, picks] of Object.entries(b.p || {})) {
      const mine = g.p[k] || new Array(g.qs.length).fill(-1);
      while (mine.length < g.qs.length) mine.push(-1);
      picks.forEach((x, j) => { if (j < mine.length && mine[j] < 0) mine[j] = x; });
      g.p[k] = mine;
    }
    return g;
  }
  function remember(g) {
    let all = {};
    try { all = JSON.parse(store.get("trivia.games") || "{}"); } catch {}
    const merged = merge(g, all[g.id]);
    all[g.id] = merged;
    const ids = Object.keys(all);
    if (ids.length > 30) for (const id of ids.slice(0, ids.length - 30)) delete all[id];
    store.set("trivia.games", JSON.stringify(all));
    return merged;
  }

  const pick = (g, player, q) => { const x = (g.p[player] || [])[q]; return x === undefined || x < 0 ? null : x; };
  const nameOf = (g, player) => g.n[player] || "Someone";
  function scoreOf(g, player) {
    const picks = g.p[player] || [];
    return g.qs.reduce((s, q, j) => s + (picks[j] === q.k ? 1 : 0), 0);
  }
  const answeredCount = (g, player) => (g.p[player] || []).filter(x => x >= 0).length;
  function standings(g) {
    return Object.keys(g.n)
      .map(id => ({ id, name: nameOf(g, id), score: scoreOf(g, id), done: answeredCount(g, id) }))
      .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  }
  // The first question this browser hasn't answered.
  const nextOpen = g => g.qs.findIndex((_, j) => pick(g, me(g), j) === null);

  // ---- Questions ----
  // Rounds started here draw from questions.json, a sample of the app's own
  // bank that sits beside this page. Rows are
  // [section, difficulty, question, [4 options], right index].
  let bank = null;
  function drawQuestions(rows, amount, category) {
    const pool = rows.filter(r => Array.isArray(r) && Array.isArray(r[3]) && r[3].length === 4 &&
      r[4] >= 0 && r[4] < 4 && (!category || r[0] === category));
    const shuffle = a => { for (let x = a.length - 1; x > 0; x--) { const y = Math.floor(Math.random() * (x + 1)); [a[x], a[y]] = [a[y], a[x]]; } return a; };
    return shuffle(pool).slice(0, amount).map(r => {
      const right = r[3][r[4]];
      // Years stay in order, as in the app: four dates read as a line.
      const a = r[0] >= 9 && r[0] <= 11 ? [...r[3]] : shuffle([...r[3]]);
      const name = (CATEGORIES.find(c => c[0] === r[0]) || [0, "Trivia"])[1];
      return { c: name, d: DIFFICULTIES[Math.min(Math.max(r[1] | 0, 0), 2)], q: r[2], a, k: a.indexOf(right) };
    });
  }
  async function fetchQuestions(amount, category) {
    // One more try if the first load fails; a phone's connection can blink.
    for (let attempt = 0; attempt < 2 && !bank; attempt++) {
      if (attempt) await new Promise(r => setTimeout(r, 600));
      try {
        const res = await fetch("questions.json");
        if (!res.ok) continue;
        const obj = await res.json();
        if (obj && Array.isArray(obj.items) && obj.items.length) bank = obj.items;
      } catch {}
    }
    return bank ? drawQuestions(bank, amount, category) : [];
  }

  // ---- Rendering ----
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const mast = sub => `
    <header class="mast">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E28"/><stop offset="1" stop-color="#E2543C"/></linearGradient></defs>
        <rect width="44" height="44" rx="12" fill="url(#mg)"/>
        <path d="M13 12h18a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6H21l-6 5v-5h-2a6 6 0 0 1-6-6v-5a6 6 0 0 1 6-6Z" fill="#fff"/>
        <text x="22" y="26.5" text-anchor="middle" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="15" fill="#E2603A">?</text>
      </svg>
      <div><div class="kicker">Daily Brief Trivia</div><h1>${sub}</h1></div>
    </header>`;
  const footer = `<footer>Questions written for Daily Brief. Nothing you play here leaves this device until you send it. <a href="/daily-brief/privacy/">Privacy</a></footer>`;

  let state = { screen: "start", game: null, cat: 0, count: 5, busy: false, error: "" };

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function nameField(id) {
    return `<label class="field" for="${id}">Your name for the scoreboard
      <input type="text" id="${id}" autocomplete="given-name" maxlength="24" placeholder="Name" value="${esc(myName)}"></label>`;
  }
  function bindName(id, onChange) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => { myName = el.value.trim(); store.set("trivia.name", myName); onChange && onChange(); });
  }

  function renderStart() {
    const chips = CATEGORIES.map(([id, name], idx) => {
      const L = look(name);
      return `<button class="chip" style="--c:${L.c}" data-cat="${idx}" aria-pressed="${idx === state.cat}">${icon(L.icon, 15)}${esc(name)}</button>`;
    }).join("");
    app.innerHTML = `
      ${mast("Start a round")}
      <section class="panel">
        <p class="soft">Pick a category, get the questions, then send the link to anyone. Everyone answers the same questions and sends their score back.</p>
        ${nameField("name")}
        <div class="row"><div class="label">Category</div><div class="chips">${chips}</div></div>
        <div class="seg" role="group" aria-label="Number of questions">
          <button data-count="5" aria-pressed="${state.count === 5}">5 questions</button>
          <button data-count="10" aria-pressed="${state.count === 10}">10 questions</button>
        </div>
        ${state.error ? `<p class="error">${esc(state.error)}</p>` : ""}
        <button class="btn" id="go" ${state.busy || !myName ? "disabled" : ""}>${state.busy ? '<span class="spin"></span>Getting questions…' : "Get questions"}</button>
      </section>
      ${footer}`;
    app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { state.cat = +b.dataset.cat; renderStart(); });
    app.querySelectorAll("[data-count]").forEach(b => b.onclick = () => { state.count = +b.dataset.count; renderStart(); });
    bindName("name", () => { document.getElementById("go").disabled = state.busy || !myName; });
    document.getElementById("go").onclick = async () => {
      state.busy = true; state.error = ""; renderStart();
      const qs = await fetchQuestions(state.count, CATEGORIES[state.cat][0]);
      state.busy = false;
      if (!qs.length) { state.error = "Couldn't get questions. Check the connection and try again."; renderStart(); return; }
      const g = { v: 1, id: Math.random().toString(16).slice(2, 10), qs, i: 0, n: {}, p: {} };
      openGame(g, "ready");
    };
  }

  function renderReady() {
    const g = state.game;
    app.innerHTML = `
      ${mast("Round ready")}
      <section class="panel">
        <p>${g.qs.length} questions${g.qs[0] ? " · " + esc(categoryLabel(g)) : ""}. Send the link now, or play first and send your score with it.</p>
        <button class="btn" id="share">Send the round</button>
        <button class="btn quiet" id="play">Play it first</button>
      </section>
      ${footer}`;
    document.getElementById("share").onclick = () => share(g, `Trivia: ${g.qs.length} questions. Tap to play.`);
    document.getElementById("play").onclick = () => { state.screen = "play"; render(); };
  }

  function categoryLabel(g) {
    const cats = [...new Set(g.qs.map(q => look(q.c).short))];
    return cats.length === 1 ? cats[0] : "Mixed categories";
  }

  function renderPlay() {
    const g = state.game;
    const j = state.q;
    const q = g.qs[j];
    const L = look(q.c);
    const mine = pick(g, me(g), j);
    const revealed = mine !== null;
    const bar = g.qs.map((_, x) => `<i class="${pick(g, me(g), x) !== null ? "done" : x === j ? "now" : ""}"></i>`).join("");
    const answers = q.a.map((text, idx) => {
      let cls = "answer", mark = "";
      if (revealed) {
        if (idx === q.k) { cls += " right"; mark = "✓"; }
        else if (idx === mine) { cls += " wrong"; mark = "✕"; }
        else cls += " faded";
      }
      const who = revealed ? Object.keys(g.n).filter(id => pick(g, id, j) === idx).map(id => id === me(g) ? "You" : nameOf(g, id)) : [];
      return `<button class="${cls}" data-a="${idx}" ${revealed || !myName ? "disabled" : ""}>
        <span class="letter">${LETTERS[idx]}</span>
        <span>${esc(text)}${who.length ? `<span class="who">${esc(who.join(", "))}</span>` : ""}</span>
        <span class="mark" aria-hidden="true">${mark}</span></button>`;
    }).join("");
    const last = nextOpen(g) === -1;
    app.innerHTML = `
      <article class="card" style="--c:${L.c}">
        <div class="meta">${icon(L.icon, 14, 2.4)}<span>${esc(L.short)} · ${esc(q.d)}</span><span class="count">${j + 1} of ${g.qs.length}</span></div>
        <div class="q">${esc(q.q)}</div>
        <div class="bar">${bar}</div>
        <span class="ghost">${icon(L.icon, 150, 1.6)}</span>
      </article>
      ${!revealed && !myName ? nameField("pname") : ""}
      <div class="answers">${answers}</div>
      ${revealed ? `
        <p class="verdict ${mine === q.k ? "good" : "bad"}">${mine === q.k ? "Right!" : "Not quite. It's " + LETTERS[q.k] + "."}</p>
        <button class="btn" id="next">${last ? "See the scores" : "Next question"}</button>` : ""}
      ${footer}`;
    bindName("pname", () => app.querySelectorAll("[data-a]").forEach(b => b.disabled = !myName));
    app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => answer(+b.dataset.a));
    const next = document.getElementById("next");
    if (next) next.onclick = () => {
      const k = nextOpen(state.game);
      if (k === -1) state.screen = "final"; else state.q = k;
      render(); window.scrollTo({ top: 0 });
    };
  }

  function answer(idx) {
    const g = state.game;
    if (!myName || pick(g, me(g), state.q) !== null) return;
    g.n[me(g)] = myName;
    const picks = g.p[me(g)] || new Array(g.qs.length).fill(-1);
    while (picks.length < g.qs.length) picks.push(-1);
    picks[state.q] = idx;
    g.p[me(g)] = picks;
    state.game = remember(g);
    history.replaceState(null, "", "#g=" + pack(state.game));
    render();
  }

  function renderFinal() {
    const g = state.game;
    const rows = standings(g);
    const mine = scoreOf(g, me(g));
    const list = rows.map((r, x) => `
      <li class="${r.id === me(g) ? "me" : ""}">
        <span class="place">${x + 1}</span><span>${esc(r.id === me(g) ? r.name + " (you)" : r.name)}</span>
        <span class="pts">${r.score} of ${g.qs.length}</span>
        ${r.done < g.qs.length ? `<span class="note">Answered ${r.done} so far</span>` : ""}
      </li>`).join("");
    app.innerHTML = `
      ${mast("Your score")}
      <section class="panel">
        <div class="trophy">${mine}<span class="soft" style="font-size:22px"> / ${g.qs.length}</span></div>
        <ol class="standings">${list}</ol>
        <button class="btn" id="share">Send my score back</button>
        <button class="btn quiet" id="again">Start a new round</button>
        <p class="small soft">Sending shares a link with your answers added, so the next person sees your score.</p>
      </section>
      ${footer}`;
    document.getElementById("share").onclick = () => share(g, `I got ${mine} of ${g.qs.length} in trivia. Your turn:`);
    document.getElementById("again").onclick = () => { history.replaceState(null, "", location.pathname); state = { ...state, screen: "start", game: null, error: "" }; render(); };
  }

  async function share(g, text) {
    const url = linkFor(g);
    if (navigator.share) {
      try { await navigator.share({ title: "Trivia", text, url }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(`${text} ${url}`); toast("Link copied. Paste it in a message."); }
    catch { location.href = "sms:?&body=" + encodeURIComponent(`${text} ${url}`); }
  }

  function openGame(g, screen) {
    state.game = remember(g);
    history.replaceState(null, "", "#g=" + pack(state.game));
    const k = nextOpen(state.game);
    state.q = k === -1 ? 0 : k;
    state.screen = screen || (k === -1 ? "final" : "play");
    render();
  }

  function renderBroken() {
    app.innerHTML = `${mast("That link didn't open")}
      <section class="panel"><p>The round in this link is incomplete. Ask for it to be sent again, or start a new one.</p>
      <button class="btn" id="again">Start a new round</button></section>${footer}`;
    document.getElementById("again").onclick = () => { history.replaceState(null, "", location.pathname); state.screen = "start"; render(); };
  }

  function render() {
    ({ start: renderStart, ready: renderReady, play: renderPlay, final: renderFinal, broken: renderBroken })[state.screen]();
  }

  function boot() {
    const m = location.hash.match(/g=([A-Za-z0-9_-]+)/);
    if (m) {
      const g = unpack(m[1]);
      if (g) { openGame(g); return; }
      state.screen = "broken";
    }
    render();
  }
  window.addEventListener("hashchange", boot);
  boot();
})();
</script>
</body>
</html>
